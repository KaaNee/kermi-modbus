[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kermi-modbus"
version = "0.0.1"
description = "Asynchronous Python library for reading and writing Kermi heat pumps (x-center / x-change dynamic pro) over Modbus TCP."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Kai Neuhaus" },
]
# Verified against modbus-connection 4.11.1 (installed and inspected its
# real Component/model API — same version e3dc-modbus was built against).
dependencies = [
    "modbus-connection>=4.11,<5",
]

[project.optional-dependencies]
# Backend for script/query.py and for talking to real hardware.
cli = [
    "modbus-connection[tmodbus]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.urls]
Repository = "https://github.com/KaaNee/kermi-modbus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
